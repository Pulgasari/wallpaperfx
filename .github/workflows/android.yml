name: android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [cosmonaut, subotnik, subotnik-wallpapers]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: setup android sdk
        uses: android-actions/setup-android@v3
        with:
          # the action's default package set includes the obsolete 'tools' package,
          # which google removed from the sdk repo -> sdkmanager fails at setup. pin
          # it to an existing package; the next step installs the rest explicitly.
          packages: platform-tools

      - name: install sdk packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: install js deps
        run: npm ci

      # apps with a bundler.config.js ship build/www (webDir): www/ plus the
      # packages it imports by specifier, staged by @aufbau/bundler from fresh
      # checkouts of the package repos (cloned into build/_src as needed)
      - name: bundle www
        if: hashFiles(format('apps/{0}/bundler.config.js', matrix.app)) != ''
        env:
          # the bundler's packages-by-specifier mode is not on aufbau main yet.
          # switch to main once claude/wallpaperfx-reorganization-4xj19p is merged there
          AUFBAU_REF: claude/wallpaperfx-reorganization-4xj19p
        run: |
          git clone --quiet --depth 1 --branch "$AUFBAU_REF" https://github.com/Pulgasari/aufbau.git build/_src/aufbau
          npm install --prefix build/_src/aufbau/bundler --no-audit --no-fund
          node build/_src/aufbau/bundler/cli.js bundler.config.js source=build/_src

      - name: capacitor sync
        run: npx cap sync android

      - name: gradle assemble debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-apk
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
