name: android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [wallpapers, launcher, filesync, browser]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: setup android sdk
        uses: android-actions/setup-android@v3
        with:
          # the action's default package set includes the obsolete 'tools' package,
          # which google removed from the sdk repo -> sdkmanager fails at setup. pin
          # it to an existing package; the next step installs the rest explicitly.
          packages: platform-tools

      - name: install sdk packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: install js deps
        run: npm ci

      - name: capacitor sync
        run: npx cap sync android

      - name: gradle assemble debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-apk
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
