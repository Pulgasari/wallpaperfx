name: ass css

# guards against generated-file drift: every apps/<app>/www/styles.css must match
# what the vendored @aufbau/ass compiler produces from apps/<app>/styles.ass.
# node-only, no app deps (the compiler is zero-dependency, vendored in tools/ass).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: check styles.css is up to date with styles.ass
        run: node tools/build-css.mjs --check
