<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Browser</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- thin per-tab load progress (position configurable: top/bottom) -->
<div id="prog" class="prog" hidden><span id="progFill"></span></div>

<!-- ===== dock: [buttons] ( pill ) [buttons] ; contents built from settings ===== -->
<div id="bar" class="bar">
    <div id="dockLeft" class="dock-group"></div>
    <button id="pill" class="pill"><span id="pillText">Suchen oder URL</span></button>
    <div id="dockRight" class="dock-group"></div>
</div>

<!-- ===== url / search ===== -->
<section id="panelUrl" class="panel" hidden aria-label="Adresse">
    <button class="backdrop" data-close aria-label="Schließen"></button>
    <div class="panel-scroll"><ul id="suggest" class="suggest"></ul></div>
    <!-- engine row: icons of all search engines, tap to search the typed query there -->
    <div id="engineRow" class="engine-row" hidden></div>
    <form id="urlForm" class="urlbar">
        <input id="urlInput" type="text" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Suchen oder URL eingeben" />
        <button type="submit" id="urlGo" class="go" aria-label="Los"></button>
    </form>
</section>

<!-- ===== find in page (bar, page stays visible behind) ===== -->
<section id="panelFind" class="panel find" hidden aria-label="Auf Seite suchen">
    <form id="findForm" class="findbar">
        <input id="findInput" type="text" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Auf Seite suchen" />
        <span id="findCount" class="find-count"></span>
        <button type="button" id="findPrev" class="ic" aria-label="Zurück">‹</button>
        <button type="submit" id="findNext" class="ic" aria-label="Weiter">›</button>
        <button type="button" id="findClose" class="ic" data-close aria-label="Schließen">×</button>
    </form>
</section>

<!-- ===== tabs overview ===== -->
<section id="panelTabs" class="panel sheet" hidden aria-label="Tabs">
    <button class="backdrop" data-close aria-label="Schließen"></button>
    <div class="sheet-body">
        <div class="sheet-head">
            <span class="sheet-title">Tabs</span>
            <span class="sheet-actions">
                <button id="newGroupBtn" class="txt-btn">Gruppe</button>
                <button id="newTabBtn" class="txt-btn">Neuer Tab</button>
            </span>
        </div>
        <div id="tabGroups"></div>
    </div>
</section>

<!-- ===== bookmarks ===== -->
<section id="panelMarks" class="panel sheet" hidden aria-label="Lesezeichen">
    <button class="backdrop" data-close aria-label="Schließen"></button>
    <div class="sheet-body">
        <div class="sheet-head">
            <span class="sheet-title">Lesezeichen</span>
            <span class="sheet-actions">
                <button id="markIoBtn" class="txt-btn">Import/Export</button>
                <button id="newFolderBtn" class="txt-btn">Ordner</button>
                <button id="addMarkBtn" class="txt-btn">Aktuelle Seite</button>
            </span>
        </div>
        <div id="markGroups"></div>
        <p id="marksEmpty" class="empty">noch keine Lesezeichen</p>

        <!-- edit a bookmark (title / url / folder / tags) -->
        <div id="markEditor" class="editor" hidden>
            <input id="markTitle" class="in" placeholder="Titel" />
            <input id="markUrl" class="in" placeholder="URL" inputmode="url" autocapitalize="off" spellcheck="false" />
            <label class="field-label">Ordner</label>
            <select id="markFolder" class="in"></select>
            <input id="markTags" class="in" placeholder="Tags (Leerzeichen-getrennt)" autocapitalize="off" spellcheck="false" />
            <div class="editor-actions">
                <button id="markDelete" class="txt-btn danger">Löschen</button>
                <button id="markCancel" class="txt-btn">Abbrechen</button>
                <button id="markSave" class="txt-btn primary">Speichern</button>
            </div>
        </div>

        <!-- import / export: to/from a file (capacitor filesystem, download on web) or
             via copy-paste in the textarea. json keeps folders; netscape html is flat. -->
        <div id="markIO" class="editor" hidden>
            <div id="markIoFmt" class="seg"></div>
            <textarea id="markIoText" class="css-area" spellcheck="false" placeholder="Speichern schreibt eine Datei und zeigt den Inhalt hier zum Kopieren. Zum Importieren eine Datei laden, oder Text hier einfügen und Import drücken."></textarea>
            <p id="markIoStatus" class="io-status" hidden></p>
            <input id="markIoFile" type="file" accept=".json,.html,.htm,application/json,text/html" hidden />
            <div class="editor-actions">
                <button id="markIoClose" class="txt-btn">Schließen</button>
                <button id="markIoLoad" class="txt-btn">Laden</button>
                <button id="markIoExport" class="txt-btn">Speichern</button>
                <button id="markIoImport" class="txt-btn primary">Import</button>
            </div>
        </div>
    </div>
</section>

<!-- ===== dashboard: start page for a new tab (bookmarks grid) ===== -->
<section id="panelDash" class="panel dash" hidden aria-label="Start">
    <div class="dash-body">
        <button id="dashSearch" class="dash-search">Suchen oder URL</button>
        <div id="dashGrid" class="dash-grid"></div>
        <p id="dashEmpty" class="empty">noch keine Lesezeichen</p>
    </div>
</section>

<!-- ===== userscripts ===== -->
<section id="panelScripts" class="panel sheet" hidden aria-label="Userscripts">
    <button class="backdrop" data-close aria-label="Schließen"></button>
    <div class="sheet-body">
        <div class="sheet-head">
            <span class="sheet-title">Userscripts</span>
            <span class="sheet-actions"><button id="newScriptBtn" class="txt-btn">Neu</button></span>
        </div>
        <ul id="scriptList" class="rows"></ul>
        <p id="scriptsEmpty" class="empty">noch keine Userscripts</p>
        <!-- editor (shown while adding/editing) -->
        <div id="scriptEditor" class="editor" hidden>
            <input id="scriptName" class="in" placeholder="Name" />
            <input id="scriptMatches" class="in" placeholder="Match-Muster, z.B. https://*.example.com/*  (Leerzeichen-getrennt)" />
            <textarea id="scriptCode" class="css-area" spellcheck="false" placeholder="// javascript, laeuft nach dem laden der seite"></textarea>
            <label class="switch-row"><span>Aktiv</span><input id="scriptEnabled" type="checkbox" checked /></label>
            <div class="editor-actions">
                <button id="scriptCancel" class="txt-btn">Abbrechen</button>
                <button id="scriptSave" class="txt-btn primary">Speichern</button>
            </div>
        </div>
    </div>
</section>

<!-- ===== settings ===== -->
<section id="panelSettings" class="panel sheet" hidden aria-label="Einstellungen">
    <button class="backdrop" data-close aria-label="Schließen"></button>
    <div class="sheet-body">
        <div class="sheet-head"><span class="sheet-title">Einstellungen</span></div>

        <h3 class="grp">Farben</h3>
        <div class="row-field"><label for="colBg">Hintergrund</label><input id="colBg" type="color" /></div>
        <div class="row-field"><label for="colFg">Vordergrund</label><input id="colFg" type="color" /></div>
        <div class="row-field"><label for="colAccent">Akzent</label><input id="colAccent" type="color" /></div>

        <h3 class="grp">Suche</h3>
        <div class="field"><button id="openEngines" class="txt-btn">Suchmaschinen verwalten</button></div>

        <h3 class="grp">Dock</h3>
        <div class="field"><label>Position</label><div id="dockPosSeg" class="seg"></div></div>
        <div class="field"><label>Ladeanzeige</label><div id="loaderPosSeg" class="seg"></div></div>
        <div class="range-field"><label>Größe <b id="valDockSize"></b></label><input id="rangeDockSize" type="range" min="36" max="60" step="1" /></div>
        <div class="range-field"><label>Abstand <b id="valDockGap"></b></label><input id="rangeDockGap" type="range" min="4" max="28" step="1" /></div>

        <h3 class="grp">Dock-Elemente</h3>
        <ul id="dockList" class="rows"></ul>
    </div>
</section>

<!-- ===== search engines (anything with a query-param url; %s = the search word) ===== -->
<section id="panelEngines" class="panel sheet" hidden aria-label="Suchmaschinen">
    <button class="backdrop" data-close aria-label="Schließen"></button>
    <div class="sheet-body">
        <div class="sheet-head">
            <span class="sheet-title">Suchmaschinen</span>
            <span class="sheet-actions"><button id="newEngineBtn" class="txt-btn">Hinzufügen</button></span>
        </div>
        <ul id="engineList" class="rows"></ul>
        <p id="enginesEmpty" class="empty">noch keine Einträge</p>
        <div id="engineEditor" class="editor" hidden>
            <input id="engName" class="in" placeholder="Name" />
            <input id="engUrl" class="in" placeholder="URL mit %s als Suchwort, z.B. https://example.com/?q=%s" inputmode="url" autocapitalize="off" spellcheck="false" />
            <input id="engIcon" class="in" placeholder="Icon-URL (optional)" inputmode="url" autocapitalize="off" spellcheck="false" />
            <label class="switch-row"><span>Als Standard</span><input id="engDefault" type="checkbox" /></label>
            <div class="editor-actions">
                <button id="engDelete" class="txt-btn danger">Löschen</button>
                <button id="engCancel" class="txt-btn">Abbrechen</button>
                <button id="engSave" class="txt-btn primary">Speichern</button>
            </div>
        </div>
    </div>
</section>

<!-- ===== context menu (anchored floating list, over the page) ===== -->
<section id="panelMenu" class="panel menu-panel" hidden aria-label="Menü">
    <button class="backdrop backdrop-clear" data-close aria-label="Schließen"></button>
    <ul id="menuList" class="menu" role="menu"></ul>
</section>

<script src="app.js"></script>
</body>
</html>
