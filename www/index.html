<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>WallpaperFX</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<!-- fullscreen live preview background -->
<canvas id="preview"></canvas>
<p id="previewHint" class="preview-hint">Vorschau erscheint nach Medienauswahl</p>

<!-- shown when the sheet is collapsed; tapping the preview also restores it -->
<button id="showUi" class="show-ui" hidden>Bedienung</button>

<!-- config as a resizable bottom sheet over the preview -->
<section id="sheet" class="sheet">
    <div id="sheetHandle" class="sheet-handle">
        <span class="grip"></span>
        <div class="sheet-head">
            <button id="collapseUi" class="icon-btn" aria-label="ui ausblenden">✕</button>
            <span class="sheet-title">WallpaperFX</span>
            <span id="status" class="status"></span>
        </div>
    </div>

    <div class="sheet-body">
    <!-- mode switch -->
    <section class="card">
        <div class="seg" role="tablist">
            <button class="seg-btn" data-mode="video" role="tab">Video</button>
            <button class="seg-btn" data-mode="images" role="tab">Bilder</button>
        </div>
    </section>

    <!-- video panel -->
    <section class="card panel" data-panel="video">
        <h2>Video</h2>
        <button id="pickVideo" class="btn">Video auswählen</button>
        <p id="videoName" class="muted">kein video gewählt</p>

        <label class="field">
            <span>Skalierung</span>
            <select id="videoScale">
                <option value="cover">Cover (ausfüllen, beschneiden)</option>
                <option value="fit">Fit (einpassen, ränder)</option>
            </select>
        </label>

        <label class="field">
            <span>Geschwindigkeit <em data-out="videoSpeed">1.00</em>x</span>
            <input id="videoSpeed" type="range" min="0.25" max="3" step="0.05" value="1" />
        </label>

        <div class="offset-group" data-for="video">
            <label class="field">
                <span>Offset X <em data-out="videoOffsetX">0.00</em></span>
                <input id="videoOffsetX" type="range" min="-1" max="1" step="0.01" value="0" />
            </label>
            <label class="field">
                <span>Offset Y <em data-out="videoOffsetY">0.00</em></span>
                <input id="videoOffsetY" type="range" min="-1" max="1" step="0.01" value="0" />
            </label>
        </div>
    </section>

    <!-- images panel -->
    <section class="card panel" data-panel="images" hidden>
        <h2>Bilder</h2>
        <button id="pickImages" class="btn">Bilder hinzufügen</button>
        <ul id="imageList" class="image-list"></ul>

        <label class="field">
            <span>Reihenfolge</span>
            <select id="imageOrder">
                <option value="normal">Normal</option>
                <option value="random">Zufall</option>
            </select>
        </label>

        <label class="field">
            <span>Anzeigedauer <em data-out="imageDurationMs">8.0</em> s</span>
            <input id="imageDurationMs" type="range" min="1000" max="60000" step="500" value="8000" />
        </label>

        <label class="field">
            <span>Überblendung <em data-out="imageTransitionMs">0.8</em> s</span>
            <input id="imageTransitionMs" type="range" min="0" max="3000" step="100" value="800" />
        </label>

        <label class="field">
            <span>Skalierung</span>
            <select id="imageScale">
                <option value="cover">Cover (ausfüllen, beschneiden)</option>
                <option value="fit">Fit (einpassen, ränder)</option>
            </select>
        </label>

        <div class="offset-group" data-for="images">
            <label class="field">
                <span>Offset X <em data-out="imageOffsetX">0.00</em></span>
                <input id="imageOffsetX" type="range" min="-1" max="1" step="0.01" value="0" />
            </label>
            <label class="field">
                <span>Offset Y <em data-out="imageOffsetY">0.00</em></span>
                <input id="imageOffsetY" type="range" min="-1" max="1" step="0.01" value="0" />
            </label>
        </div>
    </section>

    <!-- filter panel -->
    <section class="card">
        <h2>Filter</h2>
        <label class="field">
            <span>Typ</span>
            <select id="filterType">
                <option value="none">Kein</option>
                <option value="duotone">Duotone</option>
                <option value="gradientmap">Gradient Map</option>
                <option value="grayscale">Graustufen</option>
                <option value="sepia">Sepia</option>
                <option value="posterize">Posterize</option>
                <option value="invert">Invertieren</option>
                <option value="pixelate">Pixelate</option>
                <option value="halftone">Halftone</option>
                <option value="scanlines">Scanlines</option>
                <option value="crt">CRT</option>
                <option value="vignette">Vignette</option>
                <option value="chromatic">Chromatic</option>
                <option value="filmgrain">Film Grain</option>
                <option value="glitch">Glitch</option>
                <option value="vhs">VHS</option>
            </select>
        </label>

        <!-- shared color endpoints (duotone / gradient map / halftone) -->
        <div class="filter-params" data-filter="duotone gradientmap halftone" hidden>
            <label class="field">
                <span data-label="dark">Schatten / Ink</span>
                <input id="duotoneShadow" type="color" value="#12142a" />
            </label>
            <label class="field">
                <span data-label="light">Lichter / Paper</span>
                <input id="duotoneHighlight" type="color" value="#f0ba48" />
            </label>
        </div>

        <div class="filter-params" data-filter="gradientmap" hidden>
            <label class="field">
                <span>Mitte</span>
                <input id="gradientMid" type="color" value="#7854a8" />
            </label>
        </div>

        <div class="filter-params" data-filter="grayscale" hidden>
            <label class="field">
                <span>Stärke <em data-out="grayAmount">1.00</em></span>
                <input id="grayAmount" type="range" min="0" max="1" step="0.01" value="1" />
            </label>
        </div>

        <div class="filter-params" data-filter="sepia" hidden>
            <label class="field">
                <span>Stärke <em data-out="sepiaAmount">1.00</em></span>
                <input id="sepiaAmount" type="range" min="0" max="1" step="0.01" value="1" />
            </label>
        </div>

        <div class="filter-params" data-filter="posterize" hidden>
            <label class="field">
                <span>Stufen <em data-out="posterizeLevels">6</em></span>
                <input id="posterizeLevels" type="range" min="2" max="16" step="1" value="6" />
            </label>
        </div>

        <div class="filter-params" data-filter="pixelate" hidden>
            <label class="field">
                <span>Blockgröße <em data-out="pixelSize">12</em> px</span>
                <input id="pixelSize" type="range" min="2" max="64" step="1" value="12" />
            </label>
        </div>

        <div class="filter-params" data-filter="halftone" hidden>
            <label class="field">
                <span>Raster <em data-out="halftoneScale">90</em></span>
                <input id="halftoneScale" type="range" min="20" max="240" step="5" value="90" />
            </label>
        </div>

        <div class="filter-params" data-filter="scanlines crt" hidden>
            <label class="field">
                <span>Linien <em data-out="scanCount">320</em></span>
                <input id="scanCount" type="range" min="60" max="900" step="10" value="320" />
            </label>
            <label class="field">
                <span>Stärke <em data-out="scanStrength">0.35</em></span>
                <input id="scanStrength" type="range" min="0" max="1" step="0.01" value="0.35" />
            </label>
        </div>

        <div class="filter-params" data-filter="crt" hidden>
            <label class="field">
                <span>Maske <em data-out="crtMask">0.30</em></span>
                <input id="crtMask" type="range" min="0" max="1" step="0.01" value="0.3" />
            </label>
        </div>

        <div class="filter-params" data-filter="vignette" hidden>
            <label class="field">
                <span>Stärke <em data-out="vignetteStrength">0.60</em></span>
                <input id="vignetteStrength" type="range" min="0" max="1" step="0.01" value="0.6" />
            </label>
            <label class="field">
                <span>Radius <em data-out="vignetteRadius">0.60</em></span>
                <input id="vignetteRadius" type="range" min="0" max="1" step="0.01" value="0.6" />
            </label>
        </div>

        <div class="filter-params" data-filter="chromatic" hidden>
            <label class="field">
                <span>Versatz <em data-out="chromaticAmount">0.006</em></span>
                <input id="chromaticAmount" type="range" min="0" max="0.03" step="0.001" value="0.006" />
            </label>
        </div>

        <div class="filter-params" data-filter="filmgrain" hidden>
            <label class="field">
                <span>Körnung <em data-out="grainAmount">0.15</em></span>
                <input id="grainAmount" type="range" min="0" max="0.6" step="0.01" value="0.15" />
            </label>
        </div>

        <div class="filter-params" data-filter="glitch" hidden>
            <label class="field">
                <span>Stärke <em data-out="glitchAmount">0.50</em></span>
                <input id="glitchAmount" type="range" min="0" max="1" step="0.01" value="0.5" />
            </label>
        </div>

        <div class="filter-params" data-filter="vhs" hidden>
            <label class="field">
                <span>Stärke <em data-out="vhsAmount">0.60</em></span>
                <input id="vhsAmount" type="range" min="0" max="1" step="0.01" value="0.6" />
            </label>
        </div>

        <p class="muted filter-note" data-filter-note hidden>
            animierter filter: läuft nur solange sichtbar, verbraucht mehr akku.
        </p>
    </section>

    <!-- parallax panel -->
    <section class="card">
        <h2>Parallax</h2>
        <label class="field row">
            <span>Beim Wischen bewegen</span>
            <input id="parallaxEnabled" type="checkbox" />
        </label>
        <label class="field" data-for="parallax">
            <span>Stärke <em data-out="parallaxAmount">0.15</em></span>
            <input id="parallaxAmount" type="range" min="0" max="0.5" step="0.01" value="0.15" />
        </label>
    </section>

    <!-- motion panel -->
    <section class="card">
        <h2>Bewegung</h2>
        <label class="field">
            <span>Typ</span>
            <select id="motionType">
                <option value="none">Kein</option>
                <option value="zoom">Zoom (rein/raus)</option>
                <option value="breathe">Atmen</option>
                <option value="drift">Drift</option>
                <option value="sway">Schaukeln</option>
                <option value="shake">Wackeln</option>
            </select>
        </label>
        <div data-motion hidden>
            <label class="field">
                <span>Stärke <em data-out="motionAmount">0.50</em></span>
                <input id="motionAmount" type="range" min="0" max="1" step="0.01" value="0.5" />
            </label>
            <label class="field">
                <span>Tempo <em data-out="motionSpeed">0.50</em></span>
                <input id="motionSpeed" type="range" min="0" max="1" step="0.01" value="0.5" />
            </label>
        </div>
        <p class="muted" hidden data-motion>
            bewegung rendert kontinuierlich solange sichtbar, verbraucht mehr akku.
        </p>
    </section>

    <!-- app settings panel -->
    <section class="card">
        <h2>App</h2>
        <label class="field">
            <span>Theme</span>
            <select id="themeMode">
                <option value="system">System</option>
                <option value="dark">Dunkel</option>
                <option value="light">Hell</option>
            </select>
        </label>
        <label class="field">
            <span>Akzentfarbe</span>
            <input id="accentColor" type="color" value="#f0ba48" />
        </label>
        <label class="field row">
            <span>Abgerundet</span>
            <input id="rounded" type="checkbox" checked />
        </label>
    </section>
    </div>

    <footer class="sheet-actions">
        <button id="save" class="btn ghost">Speichern</button>
        <button id="apply" class="btn primary">Als Wallpaper setzen</button>
    </footer>
</section>

<script src="preview.js"></script>
<script src="app.js"></script>
</body>
</html>
